<!DOCTYPE html>
<html>
<head>
    <title>Список авторов</title>
</head>
<body>
    <h1>Список авторов</h1>
    {% if user.profile.role == 'administrator' %}
        <a href="{% url 'author_create' %}">Добавить автора</a>
    {% endif %}
    <ul>
        {% for author in authors %}
            <li>
                <a href="{% url 'author_detail' author.pk %}">{{ author.nickname }}</a>
                {% if user.profile.role == 'administrator' %}
                    - <a href="{% url 'author_update' author.pk %}">Редактировать</a>
                    - <a href="{% url 'author_delete' author.pk %}">Удалить</a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'post_list' %}">Назад к постам</a>
</body>
</html>
