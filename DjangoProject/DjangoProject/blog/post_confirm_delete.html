<!-- templates/blog/post_confirm_delete.html -->
{% extends "blog/base.html" %}

{% block content %}
    <h1>Подтверждение удаления</h1>
    <p>Вы уверены, что хотите удалить пост "{{ post.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
