<!-- templates/blog/post_form.html -->
{% extends "blog/base.html" %}

{% block content %}
    <h1>{% if form.instance.pk %}Редактировать пост{% else %}Создать пост{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit" style="margin-top: 10px;">Сохранить</button>
    </form>
    <a href="{% url 'blog:post_list' %}" style="display: inline-block; margin-top: 10px;">Отмена</a>
{% endblock %}
