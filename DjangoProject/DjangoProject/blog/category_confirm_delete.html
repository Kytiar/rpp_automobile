<!DOCTYPE html>
<html>
<head>
    <title>Удалить категорию?</title>
</head>
<body>
    <h1>Удалить категорию "{{ category.name }}"?</h1>
    <p>Вы уверены, что хотите удалить эту категорию?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'category_detail' category.pk %}">Отмена</a>
</body>
</html>
